<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf5">
  <meta name="description" content="Little Plate: know what to feed your toddler, right now. First-run prototype: welcome, sign in and setup.">
  <title>Little Plate</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Poppins:wght@500;600&display=swap">
  <link rel="preload" as="image" href="assets/photos/hero-thali.jpg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone" data-theme="light">
      <div class="status-bar" aria-hidden="true">
        <span class="status-bar__time">9:41</span>
        <span class="status-bar__icons" id="status-icons"></span>
      </div>
      <main class="viewport" id="viewport" aria-label="Little Plate"></main>
      <div id="overlays"></div>
      <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <aside class="proto-tools" id="proto-tools" aria-label="Prototype controls"></aside>
  </div>
  <noscript>Little Plate needs JavaScript to run this prototype.</noscript>
</body>
</html>
